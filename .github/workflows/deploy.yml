name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend
        run: npm run build

      - name: Deploy to EC2 /var/www/html via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST || '56.10.8.193' }}
          username: ${{ vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/*'
          target: '/home/ubuntu/frontend-dist'
          strip_components: 1

      - name: Update Nginx Web Root on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST || '56.10.8.193' }}
          username: ${{ vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp -r /home/ubuntu/frontend-dist/* /var/www/html/
            rm -rf /home/ubuntu/frontend-dist
            sudo systemctl reload nginx
            echo "Frontend deployment to EC2 completed!"
